[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-next-gen-rag-ai-portfolio"
version = "0.1.0"
description = "Independent portfolio reconstruction of an RFP-analysis Hybrid RAG pipeline"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "rank-bm25>=0.2.2"]

[project.optional-dependencies]
rag = ["langchain-ollama>=0.2", "langchain-postgres>=0.0.12", "langchain-core>=0.3", "sentence-transformers>=3.0", "psycopg[binary]>=3.1"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
